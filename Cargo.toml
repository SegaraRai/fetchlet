[workspace]
members = ["crates/*", "examples/*", "fuzz", "tools/bench", "tools/lab"]
default-members = ["crates/fetchlet"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SegaraRai/fetchlet"
# Members are private unless their manifest says otherwise; the published
# crates are publishedCrates in tools/release/versioning.ts.
publish = false

[workspace.dependencies]
fetchlet = { path = "crates/fetchlet", version = "=0.1.0", default-features = false }
fetchlet-http = { path = "crates/fetchlet-http", version = "=0.1.0" }
fetchlet-web = { path = "crates/fetchlet-web", version = "=0.1.0", default-features = false }
actix-web = { version = "4", default-features = false }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

# Debug builds keep line tables for backtraces, and dependencies none. Full
# debug info makes every test binary and its PDB hundreds of megabytes, and
# the engine, example and feature combinations multiply them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Hashing, big-integer and elliptic-curve arithmetic is orders of magnitude
# slower unoptimized; RSA key generation or a 100,000-iteration PBKDF2
# derivation in a debug build would take seconds.
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.p384]
opt-level = 3

[profile.dev.package.p521]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

# Every bridge message is JSON, and a host body read as text crosses as one
# JSON string: unoptimized, escaping megabytes of transformed modules under
# ViteDev costs more than decoding them in JavaScript.
[profile.dev.package.serde_json]
opt-level = 3
