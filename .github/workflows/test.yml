name: Test

on:
  # `stable` and the version branch only take commits that `main` or their pull request tested.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Release workflow runs the same gates before it publishes.
  workflow_call:

permissions:
  contents: read

# The gates run as parallel jobs. Each job restores its own Cargo dependency
# cache; only main saves them, so branches do not evict main's caches from
# the repository's cache quota.
jobs:
  rust:
    name: rust (${{ matrix.os }}, ${{ matrix.task }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Formatting and lints do not depend on the platform; tests run on both.
          - { os: ubuntu-latest, task: "check:rust" }
          - { os: ubuntu-latest, task: "test:rust" }
          - { os: windows-latest, task: "test:rust" }
    runs-on: ${{ matrix.os }}
    steps:
      # Each engine test binary links V8 statically, and the feature sets of
      # test:rust together outgrow the free space of the Linux runner, where
      # the linker then dies with SIGBUS. Remove toolchains no job uses.
      - if: runner.os == 'Linux' && matrix.task == 'test:rust'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: false
      - run: vp install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # The Tauri examples link WebKitGTK and GTK on Linux.
      # https://v2.tauri.app/start/prerequisites/#linux
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.task }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: vp run ${{ matrix.task }}

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: false
      - run: vp install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: vp run test:conformance
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: results-conformance-${{ matrix.os }}
          path: results/

  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: false
      - run: vp install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: vp run build:fixtures
      - run: vp run check:types
      - run: vp run check:format
      - run: vp run test:polyfills
      - run: vp run test:js
      - run: vp run test:package
      - run: vp run test:matrix
      - run: vp run test:host
      - run: vp run test:url
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: results-packages-${{ matrix.os }}
          path: results/

  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: false
      - run: vp install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Playwright installs only what the restored browser directory lacks.
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: vp run setup:browser
      - run: vp run test:examples
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: results-examples-${{ matrix.os }}
          path: results/
      # The output of the example servers and their Vite dev servers, for
      # checks that time out without it.
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: logs-examples-${{ matrix.os }}
          path: |
            .cache/*/server.log
            .cache/*/vite-dev/server.log

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz host fetch policy with AddressSanitizer
        run: cargo +nightly fuzz run fetch_service -- -max_total_time=30 -max_len=16384
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: fuzz-failure
          path: |
            fuzz/artifacts/
            fuzz/corpus/
