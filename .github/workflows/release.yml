name: Release

on:
  # `pnpm version -r` updates the ledger, so this push always carries a version commit.
  push:
    branches: [main]
    paths:
      - ".changeset/ledger.yaml"
  # The version pull request changes the ledger. Its run tests and packs the version commit
  # before the merge, and the publish jobs skip refs other than `main`.
  pull_request:
    branches: [main]
    paths:
      - ".changeset/ledger.yaml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Test and pack every package and crate, but do not upload them
        type: boolean
        default: true

permissions:
  contents: read

# A pull request run must not wait for a release on `main`, but a release on `main` must
# finish its uploads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    # Every other job depends on `test` or `pack`, so this condition limits pull request runs
    # to the version branch of this repository. A fork can also name a branch `version/main`.
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/test.yml

  pack:
    name: Pack packages and crates
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          version: "1.7.0"
          run-install: false
      - run: vp install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - run: vp run check:release
      - run: vp run @fetchlet/web#build
      - run: vp run @fetchlet/node#build
      - run: vp run fetchlet#build
      # Recursive publication skips private packages and versions that already exist on npm.
      - name: Pack every npm package
        run: vp exec pnpm publish -r --dry-run --no-git-checks
      # Packages every crate and builds it from its package against the others.
      - name: Package every crate
        run: node tools/release/publish-crates.ts --dry-run
      # `publish` packs the same files, so the archive holds only the generated outputs.
      - name: Archive the built packages
        run: |
          git ls-files -z --others --ignored --exclude-standard -- packages \
            | grep -zv -e '/node_modules/' \
            | tar --create --gzip --null --files-from - --file npm-packages.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-packages
          path: npm-packages.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: Stage npm packages
    needs: [test, pack]
    # A push has no inputs, so `dry-run` is empty and the job stages the packages.
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          version: "1.7.0"
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-packages
      - run: tar --extract --gzip --file npm-packages.tar.gz
      - name: Select the npm tag
        id: tag
        run: |
          version=$(node --print "require('./crates/fetchlet/package.json').version")
          case "$version" in
            *-*) echo 'name=next' >> "$GITHUB_OUTPUT" ;;
            *) echo 'name=latest' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Configure the bootstrap token
        # Trusted publishing needs no token. A package must exist before npm can trust this
        # workflow, so the first publication of a new package uses NPM_TOKEN.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> "$HOME/.npmrc"
          fi
      - name: Stage
        env:
          NPM_TAG: ${{ steps.tag.outputs.name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Branch rules and the job condition replace pnpm's Git checks. Recursive staging skips
        # private packages and versions that already exist on npm. A maintainer publishes the
        # staged versions by approving them with 2FA.
        run: vp exec pnpm stage publish -r --no-git-checks --tag "$NPM_TAG" --report-summary
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: publish-summary
          path: pnpm-publish-summary.json
          if-no-files-found: ignore
          retention-days: 30

  publish-crates:
    name: Publish crates
    needs: [test, pack]
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # crates.io has no staging and its versions are immutable, so the environment's required
    # reviewers approve this job before it uploads.
    environment: crates-release
    permissions:
      contents: read
      id-token: write
    env:
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          version: "1.7.0"
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts --filter @fetchlet-internal/tools-release...
      - run: rustup toolchain install stable --profile minimal
      # Trusted publishing exchanges the workflow's OIDC token for a short-lived crates.io
      # token. A crate must exist before crates.io can trust this workflow, so the first
      # publication of a new crate uses CARGO_REGISTRY_TOKEN from the environment's secrets.
      - name: Authenticate with crates.io
        id: auth
        if: env.BOOTSTRAP_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish the crates crates.io does not have yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.BOOTSTRAP_TOKEN }}
        run: node tools/release/publish-crates.ts

  github-release:
    name: Draft GitHub Release
    needs: [publish-npm, publish-crates]
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          version: "1.7.0"
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts --filter @fetchlet-internal/tools-release...
      # The draft becomes public when a maintainer publishes it after approving the staged npm
      # packages, and GitHub creates the tag at that time.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node tools/release/notes.ts "$RUNNER_TEMP/release-body.md")
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "The GitHub Release $tag already exists."
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/release-body.md"
          fi
