[package]
name = "fetchlet-fuzz"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
fetchlet = { workspace = true, features = ["fuzzing", "url", "quickjs", "process"] }
fetchlet-http.workspace = true
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
url = "2"

[[bin]]
name = "fetch_service"
path = "fuzz_targets/fetch_service.rs"
test = false
doc = false
bench = false


[[bin]]
name = "bridge_bodies"
path = "fuzz_targets/bridge_bodies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "asset_archive"
path = "fuzz_targets/asset_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "isolation_frames"
path = "fuzz_targets/isolation_frames.rs"
test = false
doc = false
bench = false
