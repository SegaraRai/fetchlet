[package]
name = "fetchlet"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Rust-hosted JavaScript functions and Fetch handlers with explicit host services"

[features]
default = ["quickjs"]
quickjs = ["dep:rquickjs", "dep:getrandom", "dep:sha2"]
boa = ["dep:boa_engine", "dep:getrandom", "dep:sha2"]
v8 = ["dep:deno_core", "dep:deno_error", "dep:getrandom", "dep:sha2"]
# Exposes a hidden harness over the private host bridge for cargo-fuzz targets.
fuzzing = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
getrandom = { version = "0.4", optional = true }
sha2 = { version = "0.11", optional = true }
bytes = "1"
http = "1"
http-body = "1"
url = "2"
thiserror = "2"
rquickjs = { version = "=0.14.0", optional = true }
boa_engine = { version = "=0.22.0", optional = true }
deno_core = { version = "=0.413.0", optional = true }
deno_error = { version = "=0.7.1", optional = true }

[[bin]]
name = "fetchlet-lab"
path = "tests/support/lab/runner.rs"

[[example]]
name = "embed"
required-features = ["quickjs"]
