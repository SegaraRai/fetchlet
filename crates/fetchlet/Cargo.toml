[package]
name = "fetchlet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
# The version placeholder for pnpm change; see docs/releasing.md.
exclude = ["package.json"]
# Lets dependents' build scripts read which engines are enabled
# (DEP_FETCHLET_ENGINES); see build.rs. Nothing is linked.
links = "fetchlet"
description = "Rust-hosted JavaScript functions and Fetch handlers with explicit host services"

[features]
default = ["quickjs", "web-apis"]
quickjs = ["dep:rquickjs", "web"]
boa = ["dep:boa_engine", "dep:boa_gc", "web"]
v8 = ["dep:deno_core", "dep:deno_error", "web"]
# Exposes a hidden harness over the private host bridge for cargo-fuzz targets.
fuzzing = ["web"]
# Host implementations of Web APIs (fetchlet-web). Every engine enables it;
# the features below select its APIs.
web = ["dep:fetchlet-web"]
web-apis = ["url", "url-pattern", "compression", "web-crypto", "node-crypto"]
compression = ["fetchlet-web?/compression"]
node-crypto = ["fetchlet-web?/node-crypto"]
url = ["fetchlet-web?/url"]
url-pattern = ["fetchlet-web?/url-pattern"]
web-crypto = ["fetchlet-web?/crypto"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
fetchlet-web = { workspace = true, optional = true }
bytes = "1"
http = "1"
http-body = "1"
url = "2"
thiserror = "2"
rquickjs = { version = "0.14", optional = true }
boa_engine = { version = "0.22", optional = true, features = ["annex-b"] }
# The derives of boa_engine's garbage-collected types name boa_gc directly.
boa_gc = { version = "0.22", optional = true }
# deno_core breaks its API in every 0.x release and requires deno_error at
# exactly this version; the pair also fixes the V8 build. Upgrade them together.
deno_core = { version = "=0.413.0", optional = true }
deno_error = { version = "=0.7.1", optional = true }

[dev-dependencies]
flate2 = "1"

[[example]]
name = "embed"
required-features = ["quickjs"]
