[package]
name = "fetchlet-hyper"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "hyper 1 connection services over the fetchlet Tower integration"

[features]
default = ["quickjs"]
quickjs = ["_backend", "fetchlet/quickjs", "fetchlet-tower/quickjs"]
boa = ["_backend", "fetchlet/boa", "fetchlet-tower/boa"]
v8 = ["_backend", "fetchlet/v8", "fetchlet-tower/v8"]
_backend = ["dep:fetchlet", "dep:fetchlet-tower", "dep:http", "dep:hyper", "dep:serde"]

[dependencies]
fetchlet = { workspace = true, optional = true }
fetchlet-tower = { workspace = true, optional = true }
http = { version = "1", optional = true }
hyper = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
http = "1"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { workspace = true, features = ["client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
