[package]
name = "fetchlet-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
# The version placeholder for pnpm change; see docs/releasing.md.
exclude = ["package.json"]
description = "Engine-independent host implementations of Web APIs for fetchlet guests"

# Each feature adds the host operations of one Web API; the guest runtime
# installs the matching globals only when the host reports them.
[features]
default = ["compression", "node-crypto", "url", "url-pattern", "web-crypto"]
compression = ["dep:brotli", "dep:flate2"]
# The synchronous hashing and key derivation of node:crypto, over the
# web-crypto feature's hash functions.
node-crypto = ["web-crypto", "dep:md-5", "dep:scrypt"]
url = ["dep:url"]
url-pattern = ["dep:urlpattern"]
web-crypto = [
  "dep:serde",
  "dep:getrandom",
  "dep:base64",
  "dep:sha1",
  "dep:sha2",
  "dep:hmac",
  "dep:hkdf",
  "dep:pbkdf2",
  "dep:rsa",
  "dep:p256",
  "dep:p384",
  "dep:p521",
  "dep:ed25519-dalek",
  "dep:x25519-dalek",
  "dep:aes",
  "dep:ghash",
  "dep:aes-kw",
  "dep:pkcs8",
  "dep:spki",
]

[dependencies]
bytes = "1"
serde = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
url = { version = "2", optional = true }
urlpattern = { version = "0.6", optional = true }
flate2 = { version = "1", optional = true }
brotli = { version = "9", optional = true }
getrandom = { version = "0.4", optional = true, features = ["sys_rng"] }
base64 = { version = "0.23", optional = true }
sha1 = { version = "0.11", optional = true, features = ["oid"] }
sha2 = { version = "0.11", optional = true, features = ["oid"] }
md-5 = { version = "0.11", optional = true }
scrypt = { version = "0.12", optional = true, default-features = false }
hmac = { version = "0.13", optional = true }
hkdf = { version = "0.13", optional = true }
pbkdf2 = { version = "0.13", optional = true, default-features = false, features = ["hmac"] }
rsa = { version = "0.10", optional = true, features = ["getrandom", "pkcs1v15"] }
p256 = { version = "0.14", optional = true, features = ["ecdsa", "ecdh", "pkcs8", "getrandom"] }
p384 = { version = "0.14", optional = true, features = ["ecdsa", "ecdh", "pkcs8", "getrandom"] }
p521 = { version = "0.14", optional = true, features = ["ecdsa", "ecdh", "pkcs8", "getrandom"] }
ed25519-dalek = { version = "3", optional = true, features = ["pkcs8", "rand_core"] }
x25519-dalek = { version = "3", optional = true, features = ["static_secrets", "getrandom"] }
aes = { version = "0.9", optional = true }
ghash = { version = "0.6", optional = true }
aes-kw = { version = "0.3", optional = true }
pkcs8 = { version = "0.11", optional = true, features = ["alloc"] }
spki = { version = "0.8", optional = true, features = ["alloc"] }
