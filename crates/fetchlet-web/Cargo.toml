[package]
name = "fetchlet-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Engine-independent host implementations of Web APIs for fetchlet guests"

# Each feature adds the host operations of one Web API; the guest runtime
# installs the matching globals only when the host reports them.
[features]
default = ["url-pattern", "compression", "crypto"]
url-pattern = ["dep:urlpattern"]
compression = ["dep:flate2", "dep:brotli"]
crypto = ["dep:getrandom", "dep:sha2"]

[dependencies]
bytes = "1"
serde_json.workspace = true
thiserror.workspace = true
url = "2"
urlpattern = { version = "0.6", optional = true }
flate2 = { version = "1", optional = true }
brotli = { version = "9", optional = true }
getrandom = { version = "0.4", optional = true }
sha2 = { version = "0.11", optional = true }
