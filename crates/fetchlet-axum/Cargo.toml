[package]
name = "fetchlet-axum"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "axum conveniences over the fetchlet Tower integration"

[features]
default = ["quickjs"]
quickjs = ["_backend", "fetchlet/quickjs", "fetchlet-tower/quickjs"]
boa = ["_backend", "fetchlet/boa", "fetchlet-tower/boa"]
v8 = ["_backend", "fetchlet/v8", "fetchlet-tower/v8"]
_backend = ["dep:fetchlet", "dep:fetchlet-tower", "dep:axum", "dep:serde", "dep:tower-service"]

[dependencies]
fetchlet = { workspace = true, optional = true }
fetchlet-tower = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tower-service = { version = "0.3", optional = true }

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
http-body = "1"
