packages:
  - fixtures/*
  - packages/*
  - examples/*
  - tools/*

overrides:
  # Every package that asks for vite or vitest gets the versions Vite+ ships.
  vite@*: "catalog:"

allowBuilds:
  core-js-pure: true
  # The platform binary comes from an optional dependency; the script only verifies it.
  esbuild: false
  # Qwik City lists it for optional image optimization, which the examples do not use.
  sharp: false

minimumReleaseAgeExclude:
  - hono@4.13.19
  - "@solidjs/start@2.2.3"
  - vinext@1.4.6
  - "@oxc-project/runtime@0.159.0"
