packages:
  - fixtures/*
  - packages/*
  - examples/*
  - tools/*

catalogs:
  # The default catalog holds the exact version of each external dependency the
  # workspace develops, tests and records results with. The lockfile pins the
  # rest of the graph. Peer ranges in packages/fetchlet stay major ranges and are
  # written there.
  default:
    "@astrojs/check": 0.9.12
    "@astrojs/svelte": 9.1.6
    "@builder.io/qwik": 1.20.4
    "@builder.io/qwik-city": 1.20.4
    "@hey-api/openapi-ts": 0.99.0
    "@hono/vite-build": 1.11.1
    "@react-router/dev": 8.5.2
    "@solidjs/meta": 0.29.8
    "@solidjs/router": 1.0.3
    "@solidjs/start": 2.2.3
    "@sveltejs/kit": 3.4.0
    "@sveltejs/vite-plugin-svelte": 7.3.1
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-start": 1.169.5
    "@tauri-apps/api": 2.12.5
    "@types/hast": 3.0.5
    "@types/node": 26.6.6
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    "@vitejs/plugin-react": 6.3.0
    "@vitejs/plugin-rsc": 0.5.39
    astro: 7.4.13
    github-slugger: 2.0.0
    # Nitro 2 (nitropack) runs on h3 1; h3 2 belongs to Nitro 3.
    h3: 1.15.11
    hono: 4.13.19
    honox: 0.1.62
    isbot: 5.2.3
    nitropack: 2.13.6
    nuxt: 4.6.4
    playwright: 1.65.1
    react: 19.3.1
    react-dom: 19.3.1
    react-router: 8.5.2
    react-server-dom-webpack: 19.3.1
    rehype-stringify: 10.0.1
    remark-frontmatter: 5.0.0
    remark-gfm: 4.0.1
    remark-parse: 11.0.0
    remark-rehype: 11.1.2
    # @solidjs/start 2.2.3 requires solid-js 1 and @solidjs/router below 2, so the
    # Solid packages follow their v1-latest tags until SolidStart supports Solid 2.
    solid-js: 1.9.19
    svelte: 5.58.0
    svelte-check: 4.7.8
    # TypeScript 7 waits for svelte-check and @astrojs/check, which accept 5 and 6.
    typescript: 6.0.3
    unified: 11.0.5
    unist-util-visit: 5.2.0
    valibot: 1.5.0
    vinext: 1.4.6
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vite-plus: 1.7.0
    vue: 3.5.45
    vue-tsc: 3.3.14
    waku: 1.0.0-rc.5
    yaml: 2.9.1

  # The ranges fetchlet publishes for its runtime dependencies, including the
  # guest Web API and Node packages compiled into it. pnpm writes them into the
  # published manifest, so they stay semver ranges that deduplicate with the
  # application's own copies.
  dep:
    "@exodus/bytes": ^1.16.0
    "@formatjs/intl-datetimeformat": ^8.2.0
    "@formatjs/intl-getcanonicallocales": ^3.4.0
    "@formatjs/intl-locale": ^5.5.0
    "@formatjs/intl-numberformat": ^10.1.0
    "@formatjs/intl-pluralrules": ^7.1.0
    buffer: ^6.0.3
    core-js-pure: ^3.51.0
    # Shares Hono with the application; the Waku adapter imports it at run time.
    hono: ^4.13.19
    pathe: ^2.0.3
    # The Node stream modules import files under lib/, which are not public API.
    readable-stream: ~4.8.0
    rolldown: ^1.3.3
    # Exact: Fetch reads the polyfill's internal disturbed slot
    # (packages/web/src/internal/streams/stream-state.ts).
    web-streams-polyfill: 4.5.1

  # Solid 2 and the full-stack Vite plugin that replaces SolidStart for it,
  # for fetchlet/solid and examples/solid-axum. The default catalog keeps
  # Solid 1 for SolidStart.
  solid2:
    "@solidjs/meta": 2.0.0
    "@solidjs/router": 2.0.0
    "@solidjs/vite-plugin": 3.0.1
    "@solidjs/web": 2.0.1
    filesystem-routing: 0.5.0
    solid-js: 2.0.1

overrides:
  # Every package that asks for vite or vitest gets the versions Vite+ ships.
  vite@*: "catalog:"

allowBuilds:
  core-js-pure: true
  # The platform binary comes from an optional dependency; the script only verifies it.
  esbuild: false
  # Qwik City lists it for optional image optimization, which the examples do not use.
  sharp: false

