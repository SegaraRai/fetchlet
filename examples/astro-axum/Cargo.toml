[package]
name = "example-astro-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Astro SSR and browser assets served by axum through fetchlet"

[features]
boa = ["fetchlet/boa"]
v8 = ["fetchlet/v8"]
# Reload the artifact when the `dev` task rebuilds it.
dev = ["fetchlet-http/dev"]
# Run Astro's development app from the Vite dev server of the `dev:vite` task.
vite-dev = ["fetchlet-http/vite-dev"]

[dependencies]
fetchlet = { workspace = true, features = ["quickjs", "web-apis"] }
fetchlet-http = { workspace = true, features = ["axum"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
axum.workspace = true
