[package]
name = "example-tanstack-start-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "TanStack Start SSR and browser assets served by axum through fetchlet"

[[bin]]
name = "example-tanstack-start-axum"
path = "server/main.rs"

[features]
boa = ["fetchlet/boa"]
v8 = ["fetchlet/v8"]
# Reload the artifact when the `dev` task rebuilds it.
dev = ["fetchlet-http/dev"]

[dependencies]
fetchlet = { workspace = true, features = ["quickjs", "web-apis"] }
fetchlet-http = { workspace = true, features = ["axum"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
axum.workspace = true
