[package]
name = "example-waku-axum"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Waku SSR and browser assets served by axum through fetchlet"

[features]
boa = ["fetchlet/boa", "fetchlet-axum/boa"]
v8 = ["fetchlet/v8", "fetchlet-axum/v8"]

[dependencies]
fetchlet = { workspace = true, features = ["quickjs"] }
fetchlet-axum = { workspace = true, features = ["quickjs"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
axum.workspace = true
tower-http.workspace = true
