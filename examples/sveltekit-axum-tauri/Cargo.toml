[package]
name = "example-sveltekit-axum-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A Markdown workspace: SvelteKit rendered by fetchlet, served by a CLI web server or a Tauri window"

[[bin]]
name = "mdw"
path = "src/main.rs"

[features]
default = ["desktop"]
# The Tauri window. Without it, `mdw` is a CLI web server that needs no webview libraries.
desktop = ["dep:tauri", "dep:tauri-build"]
# Serve build_directory (build/ by default) and reload it when the `dev` task rebuilds it.
dev = ["fetchlet-http/dev-reload"]
boa = ["fetchlet/boa"]
v8 = ["fetchlet/v8"]

[dependencies]
fetchlet = { workspace = true, features = ["quickjs", "web-apis"] }
fetchlet-http = { workspace = true, features = ["axum"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "rt-multi-thread", "fs"] }
axum.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
notify = "8.2"
open = "5.4"
sha2 = "0.11"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
tokio-stream = { version = "0.1", features = ["sync"] }
utoipa = "6"
utoipa-axum = "0.3"
# Tauri requires its crate and @tauri-apps/api to share major and minor versions.
tauri = { version = "=2.12.7", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [], optional = true }

