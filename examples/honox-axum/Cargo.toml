[package]
name = "example-honox-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "HonoX SSR and browser assets served by axum through fetchlet"

[features]
boa = ["fetchlet/boa"]
v8 = ["fetchlet/v8"]

[dependencies]
fetchlet = { workspace = true, features = ["quickjs", "web-apis"] }
fetchlet-http = { workspace = true, features = ["axum"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
axum.workspace = true
