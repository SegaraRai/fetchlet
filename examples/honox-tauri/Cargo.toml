[package]
name = "example-honox-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "HonoX SSR and browser assets served in-process to a Tauri webview through fetchlet"

[features]
# Reload the artifact and the window when the `dev` task rebuilds it.
dev = ["fetchlet-http/dev"]
boa = ["fetchlet/boa"]
v8 = ["fetchlet/v8"]

[dependencies]
fetchlet = { workspace = true, features = ["quickjs", "web-apis"] }
fetchlet-http.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Tauri requires its crate and @tauri-apps/api to share major and minor versions.
tauri = "=2.12.7"
tower.workspace = true
tower-http.workspace = true
bytes = "1"
http-body-util = "0.1"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
