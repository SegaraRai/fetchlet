[package]
name = "example-vanilla-axum"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "A Vite-built fetch handler and browser assets served by axum through fetchlet"

[[bin]]
name = "example-vanilla-axum"
path = "server/main.rs"

[features]
boa = ["fetchlet/boa"]
v8 = ["fetchlet/v8"]

[dependencies]
fetchlet = { workspace = true, features = ["quickjs", "web-apis"] }
fetchlet-http = { workspace = true, features = ["axum"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
axum.workspace = true
