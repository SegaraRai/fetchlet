[package]
name = "example-sveltekit-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "SvelteKit SSR and browser assets served by axum through fetchlet"

[features]
boa = ["fetchlet/boa"]
v8 = ["fetchlet/v8"]
# Reload the artifact when the `dev` task rebuilds it.
dev = ["fetchlet-http/dev"]

[dependencies]
fetchlet = { workspace = true, features = ["quickjs", "web-apis"] }
fetchlet-http = { workspace = true, features = ["axum", "websocket"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
axum.workspace = true
